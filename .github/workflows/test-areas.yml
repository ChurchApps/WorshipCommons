on:
  pull_request:
    paths:
      - "tests/**"

name: Test areas

permissions:
  contents: read

jobs:
  check:
    name: Every spec is in an area
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tests/areas.json
        run: node tests/setup/affected.mjs --check
